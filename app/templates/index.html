<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Model Recommender</title>
    <!-- Added cache busting -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>OCR <span class="highlight">Recommender</span></h1>
            <p>Find the perfect OCR model for your specific needs.</p>
        </header>

        <main>
            <section id="input-section" class="card">
                <h2><i class="fas fa-sliders-h"></i> Configuration</h2>
                <form id="recommendation-form" onsubmit="return false;">
                    <div class="form-group">
                        <label>Document Types (Select all that apply)</label>
                        <div class="checkbox-group-container">
                            <label class="checkbox-container">
                                <input type="checkbox" name="doc_type" value="Typed" checked>
                                <span class="checkmark"></span>
                                Typed Text
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="doc_type" value="Handwritten">
                                <span class="checkmark"></span>
                                Handwritten
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="language-group">
                        <label>Languages (Select all that apply)</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="English" checked>
                                <span class="checkmark"></span>
                                English
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="French">
                                <span class="checkmark"></span>
                                French
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="Arabic">
                                <span class="checkmark"></span>
                                Arabic
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="Japanese">
                                <span class="checkmark"></span>
                                Japanese
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="German">
                                <span class="checkmark"></span>
                                German
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" name="language" value="Spanish">
                                <span class="checkmark"></span>
                                Spanish
                            </label>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="overlap" name="overlap">
                            <span class="checkmark"></span>
                            Has Overlapping Text?
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Priority</label>
                        <div class="radio-group">
                            <label class="radio-container">
                                <input type="radio" name="preference" value="Accuracy" checked>
                                <span class="radio-mark"></span>
                                Accuracy
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="preference" value="Speed">
                                <span class="radio-mark"></span>
                                Speed
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Model Type</label>
                        <div class="radio-group">
                            <label class="radio-container">
                                <input type="radio" name="model_type" value="Both" checked>
                                <span class="radio-mark"></span>
                                Any
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="model_type" value="Open Source">
                                <span class="radio-mark"></span>
                                Open Source
                            </label>
                            <label class="radio-container">
                                <input type="radio" name="model_type" value="Closed Source">
                                <span class="radio-mark"></span>
                                Closed Source (API)
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="file-upload">Upload Document (for testing)</label>
                        <input type="file" id="file-upload" name="file" accept="image/*" class="file-input">
                    </div>

                    <button type="submit" class="btn-primary">Find Best Model <i
                            class="fas fa-arrow-right"></i></button>
                </form>
            </section>

            <section id="results-section" class="card hidden">
                <div class="results-header">
                    <h2><i class="fas fa-trophy"></i> Top Recommendation</h2>
                    <button id="reset-btn" class="btn-secondary"><i class="fas fa-redo"></i> Reset</button>
                </div>

                <div id="best-model-card" class="model-card best-match">
                    <!-- Populated by JS -->
                </div>

                <div id="test-area" class="hidden">
                    <h3><i class="fas fa-vial"></i> Live Test</h3>
                    <div class="test-controls"
                        style="margin-bottom: 1rem; display: flex; gap: 1rem; align-items: center;">
                        <button id="test-btn" class="btn-primary">
                            Test Recommended Model
                        </button>
                        <div class="select-wrapper" style="min-width: 200px;">
                            <select id="manual-model-select">
                                <option value="">-- Or Select Manually --</option>
                                <option value="EasyOCR">EasyOCR (Open)</option>
                                <option value="Tesseract">Tesseract (Open)</option>
                                <option value="TrOCR">TrOCR (Open)</option>
                                <option value="DocTR">DocTR (Open)</option>
                                <option value="Google Vision">Google Vision (API)</option>
                                <option value="Gemini 2.5">Gemini 2.5 (API)</option>
                                <option value="GPT-4o">GPT-4o (API)</option>
                                <option value="Claude 4">Claude 4 (API)</option>
                            </select>
                        </div>
                    </div>
                    <div id="test-results" class="test-results-box hidden">
                        <div id="loading-spinner" class="hidden"><i class="fas fa-spinner fa-spin"></i> Processing...
                        </div>
                        <div id="ocr-output"></div>
                        <div id="ocr-time" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">
                        </div>
                    </div>
                </div>

                <h3>Other Candidates</h3>
                <div id="other-candidates" class="candidates-grid">
                    <!-- Populated by JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Added cache busting -->
    <script src="{{ url_for('static', filename='js/script.js') }}?v=10"></script>
</body>

</html>
